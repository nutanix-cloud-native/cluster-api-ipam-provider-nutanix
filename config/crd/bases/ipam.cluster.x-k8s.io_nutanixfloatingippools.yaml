                  Subnet is the Nutanix external subnet to allocate floating IPs from.
                  When type is name, the Cluster field must be set in order to resolve the name to a UUID.
                properties:
                  name:
                    description: name is the resource name in the PC
                    minLength: 1
                    type: string
                  type:
                    description: Type is the identifier type to use for this resource.
                    enum:
                    - uuid
                    - name
                    type: string
                  uuid:
                    description: uuid is the UUID of the resource in the PC.
                    format: uuid
                    maxLength: 36
                    minLength: 36
                    type: string
                required:
                - type
                type: object
                x-kubernetes-validations:
                - message: '''name'' must be set when type is ''name'', and forbidden
                    otherwise'
                  rule: 'self.type == ''name'' ? has(self.name) : !has(self.name)'
                - message: '''uuid'' must be set when type is ''uuid'', and forbidden
                    otherwise'
                  rule: 'self.type == ''uuid'' ? has(self.uuid) && self.uuid.contains(''-'')
                    : !has(self.uuid)'
            required:
            - prismCentral
            - subnet
            type: object
            x-kubernetes-validations:
            - message: cluster is required when subnet.type is name
              rule: self.subnet.type == 'uuid' || has(self.cluster)
