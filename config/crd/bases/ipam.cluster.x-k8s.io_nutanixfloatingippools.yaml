    name: v1alpha2
    schema:
      openAPIV3Schema:
        description: NutanixFloatingIPPool is the Schema for the nutanixfloatingippools
          API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NutanixFloatingIPPoolSpec defines the desired state of NutanixFloatingIPPool.
            properties:
              cluster:
                description: |-
                  Cluster is the Nutanix PE cluster to use to resolve the Subnet name to a UUID.
                  This field is only required when Subnet.type is name.
                properties:
                  name:
                    description: name is the resource name in the PC
                    minLength: 1
                    type: string
                  type:
                    description: Type is the identifier type to use for this resource.
                    enum:
                    - uuid
                    - name
                    type: string
                  uuid:
                    description: uuid is the UUID of the resource in the PC.
                    format: uuid
                    maxLength: 36
                    minLength: 36
                    type: string
                required:
                - type
                type: object
                x-kubernetes-validations:
                - message: '''name'' must be set when type is ''name'', and forbidden
                    otherwise'
                  rule: 'self.type == ''name'' ? has(self.name) : !has(self.name)'
                - message: '''uuid'' must be set when type is ''uuid'', and forbidden
                    otherwise'
                  rule: 'self.type == ''uuid'' ? has(self.uuid) && self.uuid.contains(''-'')
                    : !has(self.uuid)'
              prismCentral:
                description: PrismCentral is the configuration details of the Prism
                  Central instance to use for floating IP allocation.
                properties:
                  additionalTrustBundle:
                    description: |-
                      AdditionalTrustBundle is a PEM encoded x509 cert for the RootCA that was used to create the certificate
                      for a Prism Central that uses certificates that were issued by a non-publicly trusted RootCA. The trust
                      bundle is added to the cert pool used to authenticate the TLS connection to the Prism Central.
                    properties:
                      trustBundleConfigMapRef:
                        description: ConfigMapReference to the configmap holding the
                          trust bundle data.
                        properties:
                          name:
                            description: Name is the name of the referenced configmap.
                            type: string
                        required:
                        - name
                        type: object
                      trustBundleData:
                        description: Data of the trust bundle.
                        format: byte
                        type: string
                    type: object
                  address:
                    description: |-
                      Address is the address of the Prism Central instance to use for IPAM.
                      Address can either be the IP address or the DNS name of the Prism Central instance, omitting
                      the protocol and port.
                    type: string
                  credentialsSecretRef:
                    description: |-
                      CredentialsSecretRef is the reference to the secret containing the credentials to use to connect
                      the specified Prism Central.
                    properties:
                      name:
                        description: Name is the name of the referenced secret.
                        type: string
                    required:
                    - name
                    type: object
                  insecure:
                    default: false
                    description: use insecure connection to Prism endpoint
                    type: boolean
                  port:
                    default: 9440
                    description: Port is the port of the Prism Central instance to
