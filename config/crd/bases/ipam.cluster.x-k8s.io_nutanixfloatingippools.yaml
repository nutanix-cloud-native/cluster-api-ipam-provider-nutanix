  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: nutanixfloatingippools.ipam.cluster.x-k8s.io
spec:
  group: ipam.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: NutanixFloatingIPPool
    listKind: NutanixFloatingIPPoolList
    plural: nutanixfloatingippools
    singular: nutanixfloatingippool
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: External subnet identifier type (uuid or name)
      jsonPath: .spec.subnet.type
      name: SubnetType
      type: string
    - description: Optional PE Cluster identifier type
      jsonPath: .spec.cluster.type
      name: ClusterType
      type: string
    - jsonPath: .metadata.creationTimestamp
