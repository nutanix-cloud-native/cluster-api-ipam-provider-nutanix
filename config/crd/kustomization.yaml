apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
- pairs:
    cluster.x-k8s.io/v1beta1: v1alpha2
    clusterctl.cluster.x-k8s.io/move: ""

# This kustomization.yaml is not intended to be run by itself,
# since it depends on service name and namespace that are out of this kustomize package.
# It should be run by config/
resources:
- bases/ipam.cluster.x-k8s.io_nutanixippools.yaml
- bases/ipam.cluster.x-k8s.io_nutanixfloatingippools.yaml
- bases/ipam.cluster.x-k8s.io_floatingipclaims.yaml
- bases/ipam.cluster.x-k8s.io_floatingips.yaml
- bases/ipam.cluster.x-k8s.io_floatingipbindings.yaml

configurations:
- kustomizeconfig.yaml

patches:
- path: patches/cainjection_in_nutanixippools.yaml
- path: patches/webhook_in_nutanixippools.yaml
- path: patches/cainjection_in_nutanixfloatingippools.yaml
- path: patches/cainjection_in_floatingipclaims.yaml
- path: patches/cainjection_in_floatingips.yaml
- path: patches/cainjection_in_floatingipbindings.yaml
- path: patches/enhancedvalidation_in_nutanixippools.json
  target:
    group: apiextensions.k8s.io
    version: v1
    kind: CustomResourceDefinition
    name: nutanixippools.ipam.cluster.x-k8s.io
- path: patches/enhancedvalidation_in_nutanixfloatingippools.json
  target:
    group: apiextensions.k8s.io
    version: v1
    kind: CustomResourceDefinition
    name: nutanixfloatingippools.ipam.cluster.x-k8s.io
