# Enable conversion webhook for multi-version NutanixIPPool CRD.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nutanixippools.ipam.cluster.x-k8s.io
spec:
  conversion:
    strategy: Webhook
    webhook:
      conversionReviewVersions:
      - v1
      clientConfig:
        # Placeholder; cert-manager injects the real CA bundle.
        caBundle: Cg==
        service:
          namespace: system
          name: webhook-service
          path: /convert
