managementClusterName: caipamx-e2e

providers:
- name: cluster-api
  type: CoreProvider
  versions:
  - name: "${CAPI_VERSION}"
    value: "https://github.com/kubernetes-sigs/cluster-api/releases/download/${CAPI_VERSION}/core-components.yaml"
    type: url
    contract: v1beta2

- name: kubeadm
  type: BootstrapProvider
  versions:
  - name: "${CAPI_VERSION}"
    value: "https://github.com/kubernetes-sigs/cluster-api/releases/download/${CAPI_VERSION}/bootstrap-components.yaml"
    type: url
    contract: v1beta2

- name: kubeadm
  type: ControlPlaneProvider
  versions:
  - name: "${CAPI_VERSION}"
    value: "https://github.com/kubernetes-sigs/cluster-api/releases/download/${CAPI_VERSION}/control-plane-components.yaml"
    type: url
    contract: v1beta2

- name: nutanix
  type: IPAMProvider
  versions:
  - name: "${E2E_PROVIDER_VERSION}"
    value: "${E2E_IPAM_COMPONENTS}"
    type: url
    contract: v1beta2
    files:
    - sourcePath: "../data/ipam/metadata.yaml"
      targetName: metadata.yaml

variables:
  # To run Nutanix provider tests, set following variables here or as env vars.
  # IP/FQDN of Prism Central.
  NUTANIX_ENDPOINT: "${NUTANIX_ENDPOINT}"
  # Port of Prism Central. Default: 9440.
  NUTANIX_PORT: "9440"
  # Prism Central user.
  NUTANIX_USER: "${NUTANIX_USERNAME}"
  # Prism Central password.
  NUTANIX_PASSWORD: "${NUTANIX_PASSWORD}"
  # Prism Central TLS verification mode.
  NUTANIX_INSECURE: "false"
  # Name or UUID of the subnet to reserve IPs from.
  NUTANIX_SUBNET: "${NUTANIX_SUBNET}"
  # Optional PE cluster to resolve a VLAN subnet name. Leave empty for overlay/project subnets
  # (prefer subnet UUID), or when using NUTANIX_PRIVATE_SUBNET as an overlay subnet.
  NUTANIX_CLUSTER: "${NUTANIX_CLUSTER}"
  # External subnet name or extID for floating-IP allocation. Floating-IP specs skip when unset.
  NUTANIX_EXTERNAL_SUBNET: "${NUTANIX_EXTERNAL_SUBNET}"
  # Optional Prism project name or UUID (mapped to NutanixResourceIdentifier in tests).
  NUTANIX_FLOATING_IP_PROJECT: "${NUTANIX_FLOATING_IP_PROJECT}"
  # Optional overlay private subnet for floating-IP association. Defaults to NUTANIX_SUBNET when unset.
  NUTANIX_PRIVATE_SUBNET: "${NUTANIX_PRIVATE_SUBNET}"
